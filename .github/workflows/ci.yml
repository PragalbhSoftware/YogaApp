name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test YogaMarketplace.sln -c Release

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      # Idempotent: safe to run against any database version, including one that is already current.
      - run: >-
          dotnet ef migrations script --idempotent
          --project src/YogaMarketplace.Infrastructure
          --startup-project src/YogaMarketplace.Infrastructure
          -o artifacts/migrations.sql
      - uses: actions/upload-artifact@v4
        with:
          name: migrations-sql
          path: artifacts/migrations.sql

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/YogaMarketplace.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs Node 20.19+.
          node-version: 22
          cache: npm
          cache-dependency-path: src/YogaMarketplace.Client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
