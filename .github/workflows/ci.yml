name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Throwaway server for the migration tests; the password only exists inside this job.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-only-Passw0rd -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test YogaMarketplace.sln -c Release
        env:
          YOGA_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Ci-only-Passw0rd;TrustServerCertificate=True

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      # Idempotent: safe to run against any database version, including one that is already current.
      - run: >-
          dotnet ef migrations script --idempotent
          --project src/YogaMarketplace.Infrastructure
          --startup-project src/YogaMarketplace.Infrastructure
          -o artifacts/migrations.sql
      - uses: actions/upload-artifact@v4
        with:
          name: migrations-sql
          path: artifacts/migrations.sql

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/YogaMarketplace.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs Node 20.19+.
          node-version: 22
          cache: npm
          cache-dependency-path: src/YogaMarketplace.Client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
